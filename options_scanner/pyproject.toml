[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "options-scanner"
version = "0.2.0"
description = "Options Opportunity Scanner — recommend-only options decision-support engine."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
options-scanner = "options_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["options_scanner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

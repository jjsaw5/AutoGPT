name: Scheduled scan

# Durable, container-independent automation for the SCAN half of a session
# (spec cadence: 3x/day + events; see SESSION.md). Runs on GitHub's infra, so it
# survives the ephemeral dev container and reaches Turso/FMP/UW directly (no
# proxy). The position REVIEW is NOT here — it needs the human-gated Robinhood
# pull, so it stays interactive.
#
# ACTIVATION: GitHub only reads workflows at the repo root. In the AutoGPT
# monorepo this file sits under options_scanner/ and is dormant; it goes live
# automatically once the scanner is the repo root (jjsaw5/AI-Trade-Agent).
#
# REQUIRED SECRETS (repo Settings -> Secrets and variables -> Actions):
#   FMP_API_KEY · UW_API_KEY · TURSO_DATABASE_URL · TURSO_AUTH_TOKEN

on:
  workflow_dispatch: {}          # manual run (always executes, bypasses the gate)
  schedule:
    # Fire generously for both DST offsets; the ET gate below keeps only the
    # three real windows (10:00 / 12:45 / 15:15 ET), so exactly 3 run/weekday
    # year-round. EDT (summer) uses the first three; EST (winter) the last three.
    - cron: "3 14 * * 1-5"       # 10:00 ET (EDT)
    - cron: "47 16 * * 1-5"      # 12:45 ET (EDT)
    - cron: "17 19 * * 1-5"      # 15:15 ET (EDT)
    - cron: "3 15 * * 1-5"       # 10:00 ET (EST)
    - cron: "47 17 * * 1-5"      # 12:45 ET (EST)
    - cron: "17 20 * * 1-5"      # 15:15 ET (EST)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gate to ET market windows (DST-correct, weekdays)
        id: gate
        run: |
          python - <<'PY'
          import os, datetime, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          windows = [10*60, 12*60+45, 15*60+15]      # 10:00, 12:45, 15:15 ET
          run = now.weekday() < 5 and any(
              abs(now.hour*60 + now.minute - w) <= 20 for w in windows)
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              run = True                              # manual always runs
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          print(f"ET now={now:%Y-%m-%d %H:%M %Z} -> run={run}")
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run scan (scan-only; book review is human-gated)
        if: steps.gate.outputs.run == 'true'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m options_scanner.cli scan --history history | tee scan_readout.txt

      - name: Publish digest to the run summary
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            echo '## Scan digest'
            echo '```'
            sed -n '1,60p' scan_readout.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full readout
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-readout-${{ github.run_id }}
          path: scan_readout.txt
          retention-days: 30

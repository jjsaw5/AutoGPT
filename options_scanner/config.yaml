# Options Opportunity Scanner — configuration (Build Spec v0.2, §10)
# Recommend-only decision support. A human confirms every order.
# Secrets are NOT stored here — see .env.example.

account:
  size: 5000                      # base account size (repoint to real balance anytime)
  # Percentage-based sizing (of account size). Less aggressive per review.
  risk_standard_pct: 0.04         # 4%  = $200 @ $5k  (normal trade)
  risk_high_conviction_pct: 0.08  # 8%  = $400 @ $5k  (top-decile ceiling; was 10%/$500)
  speculative_pct: 0.03           # 3%  = $150 @ $5k  (speculative / 0DTE)
  max_open_pct: 0.30              # 30% = $1500 @ $5k (aggregate open risk; was 40%/$2000)
  max_correlated_pct: 0.15        # 15% = $750 @ $5k  (per-underlying/sector cluster)
  max_positions: 6                # G7 concurrent position cap
  # Legacy fixed-$ fallbacks (used only if the _pct knobs above are absent):
  risk_standard_max: 200
  risk_high_conviction_max: 500
  max_open_risk: 2000

budget:
  zerodte_per_week: 3             # G5 — self-imposed discipline (PDT cap eliminated 6/4/2026)

universe:
  mode: two_tier                  # Option B
  cap_tiers: [MEGA, LARGE, MID, SMALL]   # MICRO manual override only
  tier_a_liquidity_floor_oi: 500
  tier_b_feeds:
    - flow_alerts
    - hottest_chains
    - movers
    - oi_change
    - vol_anomaly
    - congress_insider
    - upcoming_catalysts
  spread_max_pct: 0.10            # G2; 0.05 for 0DTE / short-dated
  # Curated Tier A core watch. Optionable, liquid, spread-tight names across cap tiers.
  tier_a:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - TSLA
    - AMD
    - SPY
    - QQQ
    - NFLX
    - JPM
    - XOM
    - BAC
    - INTC

gates:
  oi_min: 500                     # G1 open interest floor
  contract_vol_min: 100           # G1 contract volume floor
  spread_max_pct: 0.10            # G2
  spread_max_pct_0dte: 0.05       # G2 short-dated
  underlying_dollar_vol_floor:    # G3 avg daily $ volume floor by cap tier
    MEGA: 500000000
    LARGE: 200000000
    MID: 50000000
    SMALL: 10000000
    MICRO: 0                      # manual override only
  assignment_dte_flag: 2          # G9 short leg ITM within N days of expiry
  intraday_margin_safe_harbor: 250  # G10 (~lesser of 5% equity / $1,000)

scoring:
  weights: {P1: 25, P2: 22, P3: 20, P4: 18, P5: 10, P6: 5}
  go_threshold: 72
  watch_threshold: 58

market_context:
  enabled: true                    # cross-asset risk-on/off regime (once per scan)
  max_composite_adjustment: 5      # +/- points a fully-aligned/opposed regime nudges composite
  # A bullish thesis in a risk-off tape is penalized (and vice versa); set the
  # adjustment to 0 to make the regime advisory-only (readout note, no score change).

structure:
  ivr_cheap_max: 30               # IV rank <= this => "cheap" (buy premium)
  ivr_rich_min: 50                # IV rank >= this => "rich" (sell premium)
  leaps_delta_target: [0.70, 0.80]  # deep-ITM stock replacement

journal:
  # Also shadow-track gate-passing, positive-EV WATCH candidates (not just GO /
  # budget-blocked). Needed to accumulate calibration data when GOs are rare and
  # to test whether WATCH wins as often as GO. Set false for GO-only tracking.
  shadow_watch: true

speculative_bucket:
  separated: true
  quality_bar_min_composite: 75   # higher bar; surface only strong spec setups
  counts_against_core_risk: false
  human_approve_each: true

cadence:
  premarket_scan: true
  intraday_interval_min: 30
  eod_scan: true

catalysts:
  enabled: true
  horizon_days: 14                # forward window for the CATALYST RADAR
  macro_calendar_file: macro_calendar.yaml   # curated FOMC/CPI/NFP (maintain quarterly)

execution:
  # human_approved: the agent MAY place an order, but ONLY when the human
  # explicitly asks for / approves that specific trade. No automated trading,
  # ever. See EXECUTION.md for the full protocol.
  mode: human_approved
  auto_trade: false               # HARD: never place an order unprompted / on a schedule
  require_explicit_request: true  # a specific human ask or approval is required per order
  require_preview: true           # always review_option_order and show it before placing
  tradable_accounts:              # only accounts this agent is permitted to act on
    - "992952861"                 # Agentic (agentic_allowed=true). Individual is agent-blocked.
  log_placed_orders: true         # record every placed order to the journal

data:
  unusual_whales_tier: base_api   # polling; no websocket/kafka/historical tape
  fmp_base_url: https://financialmodelingprep.com
  uw_base_url: https://api.unusualwhales.com
  cache_ttl_seconds: 300          # per-ticker per-scan cache; never duplicate calls
  request_timeout_seconds: 20
